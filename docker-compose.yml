# OpenPNE local development stack — NOT a production deployment.
#   bin/dev-up   →   http://localhost:8080   (caught mail → http://localhost:8025)
#
# Tuned for the inner loop: source is bind-mounted, Vite serves HMR, outgoing mail
# is caught by Mailpit, and queued work runs inline (QUEUE_CONNECTION=sync) so mail
# appears immediately without a worker. A production stack (released image, real
# DB/SMTP, queue worker + scheduler) is deliberately separate.
#
# - Every service that writes to the bind mount runs as OPENPNE_UID:OPENPNE_GID
#   (default 1000:1000 — export both if your host user differs), so generated
#   files keep host ownership. vendor/ and node_modules/ live on the bind mount.
# - SQLite is used by default; opt in to MySQL via a separate compose file.
# - `vite` runs the Vite dev server on :5173 for HMR; Laravel reads
#   `public/hot` to redirect asset URLs to it. First startup runs `npm ci`.

services:
  app:
    build: .
    user: "${OPENPNE_UID:-1000}:${OPENPNE_GID:-1000}"
    # Override .env for the container only: deliver all mail to Mailpit and run queued
    # work inline, so registration/reset mail shows up at :8025 with no worker. php-fpm
    # passes these through (clear_env = no), so they win over .env. Production wires real
    # SMTP and a real queue + worker instead.
    environment:
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: sync
      # The mapped uid has no passwd entry in the container; tools that insist on
      # a writable HOME (composer) get a harmless one.
      HOME: /tmp
      # Where the imgproxy service below is; .env opts in with OPENPNE_IMAGE_PROCESSOR=imgproxy.
      OPENPNE_IMGPROXY_URL: http://imgproxy:8080
      OPENPNE_IMGPROXY_KEY: 943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881
      OPENPNE_IMGPROXY_SALT: 520f986b998545b4785e0defbc4f3c1203f22de2374a3d53cb7a7fe9fea309c5
    volumes:
      - .:/var/www/html
    depends_on:
      - mailpit
      - imgproxy

  nginx:
    image: nginx:1.31.5-alpine
    ports:
      - "${OPENPNE_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  vite:
    image: node:26.8.1-bookworm-slim
    user: "${OPENPNE_UID:-1000}:${OPENPNE_GID:-1000}"
    working_dir: /var/www/html
    environment:
      HOME: /tmp
    entrypoint: ["sh", "/var/www/html/docker/vite-dev.sh"]
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  # Dev mail sink: catches every outgoing mail instead of delivering it and shows
  # it at http://localhost:8025. The app reaches it over SMTP on the compose network.
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "${OPENPNE_MAILPIT_PORT:-8025}:8025"

  # Optional image processor (docs/internals/images.md, "Processing"): reads the app's spool directory
  # as local:// and is used only when .env says OPENPNE_IMAGE_PROCESSOR=imgproxy. The key and salt are
  # this dev stack's; a production stack generates its own (openssl rand -hex 32) and sets the same
  # values on the app. Security options are allowed because every URL the app sends is signed.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.14
    environment:
      IMGPROXY_KEY: 943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881
      IMGPROXY_SALT: 520f986b998545b4785e0defbc4f3c1203f22de2374a3d53cb7a7fe9fea309c5
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /spool
      IMGPROXY_ALLOWED_SOURCES: local://
      IMGPROXY_ALLOW_SECURITY_OPTIONS: "true"
      # Stated rather than inherited: the budgets docs/internals/images.md quotes.
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_ANIMATION_FRAME_RESOLUTION: "0"
    volumes:
      - ./storage/app/image-spool:/spool:ro
