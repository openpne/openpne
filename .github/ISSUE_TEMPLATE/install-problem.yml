name: Install or update problem
description: A site that would not install, start or update by the guides.
title: "Install: "
body:
  - type: markdown
    attributes:
      value: |
        For a site that would not install, start, or move to the next release. English or Japanese, either is fine.

        Leave out secrets: `APP_KEY`, passwords, tokens, and anything about your members. A security problem goes to the [private report form](https://github.com/openpne/openpne/security/advisories/new), not here.
  - type: dropdown
    id: method
    attributes:
      label: How the site was installed
      options:
        - Release archive
        - Git checkout of a release tag
        - Git checkout of main
        - Docker (bin/dev-up)
        - Something else (say which below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenPNE version
      description: The release, from the archive's name or its `RELEASE` file, or the commit (`git rev-parse --short HEAD`). For an update, the release you left and the one you were moving to.
      placeholder: v4.0.0-alpha.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system or host
      description: The distribution and its version, or on a shared host the hosting service and its plan.
      placeholder: Ubuntu 26.04
  - type: input
    id: php
    attributes:
      label: PHP version
      description: The first line of `php -v`.
      placeholder: PHP 8.5.4 (cli)
  - type: input
    id: database
    attributes:
      label: Database and its version
      placeholder: MySQL 8.4
  - type: dropdown
    id: web
    attributes:
      label: Web server
      options:
        - nginx with PHP-FPM
        - Apache with mod_php
        - Apache with PHP-FPM
        - The Docker stack's own
        - Something else (say which below)
  - type: input
    id: step
    attributes:
      label: Where it stopped
      description: The guide and the step.
      placeholder: docs/installing.md, step 3
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you did and what happened
      description: The command you ran or the page you opened, and what you saw instead of what the guide says.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command's output, or the error the page showed, as text.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of the newest `storage/logs/laravel-*.log`, and of the web server's error log when a page answered 500 or stayed blank.
      render: text
