# The checks of .github/scripts/release-compat.sh as jobs. With nothing to update from, the lookup
# finds none and the other two jobs are skipped.
name: Release compatibility

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check. Defaults to the commit the caller runs on.
        type: string
        default: ''
      baseline:
        description: Tag or commit to update from. Defaults to the last release, or to a release branch ahead of it.
        type: string
        default: ''
      onto:
        description: Branch the change is going onto, when it is a pull request.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  baseline:
    name: Find the last release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      from: ${{ steps.find.outputs.from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Find the last release
        id: find
        env:
          GIVEN: ${{ inputs.baseline }}
          ONTO: ${{ inputs.onto }}
        run: |
          set -euo pipefail
          from="$GIVEN"
          if [ -z "$from" ]; then
            from=$(.github/scripts/release-compat.sh baseline "$ONTO")
          fi
          if [ -z "$from" ]; then
            echo "No release yet: nothing to be compatible with."
          else
            git rev-parse --verify --quiet "$from^{commit}" >/dev/null \
              || { echo "::error::$from is not a commit in this repository"; exit 1; }
            echo "Updating from $from."
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"

  migrations:
    name: Released migrations are unchanged
    needs: baseline
    if: needs.baseline.outputs.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - env:
          BASELINE: ${{ needs.baseline.outputs.from }}
        run: .github/scripts/release-compat.sh migrations "$BASELINE" HEAD

  rehearse:
    name: Update from the last release (${{ matrix.db }})
    needs: baseline
    if: needs.baseline.outputs.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, mariadb]
    env:
      # The images ci.yml's mysql-shard and mariadb-shard jobs pin: bump a tag and its digest there and
      # here together, and MySQL's in release.yml too.
      MYSQL_IMAGE: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 # 8.4.11
      MARIADB_IMAGE: mariadb:10.11@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7 # 10.11.19
      DB_CONNECTION: ${{ matrix.db }}
      BASELINE: ${{ needs.baseline.outputs.from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Start ${{ matrix.db }}
        if: matrix.db != 'sqlite'
        env:
          IMAGE: ${{ matrix.db == 'mysql' && env.MYSQL_IMAGE || env.MARIADB_IMAGE }}
          ADMIN: ${{ matrix.db == 'mysql' && 'mysqladmin' || 'mariadb-admin' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker pull "$IMAGE"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not pull $IMAGE after 5 attempts"
              exit 1
            fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          # The MariaDB image takes the MYSQL_ variables as well as its own.
          docker run -d --name db -p 3306:3306 --tmpfs /var/lib/mysql:rw \
            -e MYSQL_ROOT_PASSWORD=secret -e MYSQL_DATABASE=openpne_rehearsal \
            --health-cmd="$ADMIN ping -h 127.0.0.1 -uroot -psecret" \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            "$IMAGE"
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' db)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' db)" != true ]; then
              echo "::error::$DB_CONNECTION exited during startup"
              docker logs db
              exit 1
            fi
            sleep 5
          done
          echo "::error::$DB_CONNECTION did not become healthy within 200s (last status: $status)"
          docker logs db
          exit 1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Update a site from the last release
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: openpne_rehearsal
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: .github/scripts/release-compat.sh rehearse "$BASELINE" HEAD
