name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to test.
        type: string
        required: true

permissions:
  contents: read

# A called run has the caller's ref (main), so it takes a group of its own: sharing main's would
# let a merge to main and a release in progress cancel one another.
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' && github.ref != 'refs/heads/main' }}

jobs:
  # Decide whether anything outside docs changed; the lanes below run only when code changed and
  # are skipped (via `if`, never paths-ignore) on a docs-only change. A job skipped by `if` reports
  # a "skipped" conclusion, which branch protection treats as satisfied — a paths-ignore filter
  # would instead never report the status, so a required check would wait forever on a docs-only PR.
  # A file is "docs" iff it is a *.md (any depth), under docs/, or LICENSE; anything else is code.
  # On an unknown base (first push / force-push) or no diff, fall back to running the full CI.
  #
  # NOTE: the required-checks set must include this "Detect changed paths" job, not just the lanes:
  # the lanes report "skipped" on docs-only PRs, so a broken `changes` job (which skips them via
  # `needs`) must not let a code PR merge untested — making `changes` itself required closes that.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Detect non-docs changes
        id: detect
        env:
          CALLED_FOR: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$CALLED_FOR" ]; then
            echo "called for $CALLED_FOR; running full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_re='(^|/)[^/]+\.md$|^docs/|^LICENSE$'

          if [ "$EVENT" = "pull_request" ]; then
            base="${BASE_SHA:-}"
          else
            base="${BEFORE_SHA:-}"
          fi

          # Never skip on uncertainty: unknown/absent base => run the full CI.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base commit unavailable; running full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "changed files:"
          printf '%s\n' "$files"

          if [ -z "$files" ]; then
            echo "no changed files; running full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qvE "$docs_re"; then
            echo "non-docs change detected; running code lanes"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change; skipping code lanes"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  smoke-php-8-3:
    name: Smoke (PHP 8.3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: php artisan --version

  # The sqlite lane and the mysql and mariadb aggregators (below) are standalone jobs, not
  # matrix combinations, so the `if` gate produces stable, named "skipped" checks on a docs-only PR.
  # A job-level `if` on a matrix job is evaluated before the matrix expands, so the per-combination
  # check names may never be created — leaving a required check pending forever. The shards
  # sidestep this by being non-required; see the aggregator note below.
  test-sqlite:
    name: Test (PHP 8.5, sqlite)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - run: php artisan migrate --force
      - run: php artisan test --parallel

  # Not a required check, though a release waits on it as on every lane: each run installs unpinned
  # from Docker Hub, the AlmaLinux mirrors, EPEL and Remi, so an outage at any of them turns it red.
  test-sqlite-floor:
    name: Test (PHP 8.5, sqlite 3.26)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # Not a `container:` job, whose steps would all run as root, where the tests that need mode bits
      # to bind skip (TestCase::skipUnlessModeBitsBind()): here only dnf runs as root.
      - name: Start AlmaLinux 8
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull almalinux:8; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not pull almalinux:8 after 5 attempts"
              exit 1
            fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          docker run -d --name el8 -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -v "$GITHUB_WORKSPACE:/app" -w /app almalinux:8 sleep infinity
      - name: Install PHP 8.5 from Remi
        run: |
          docker exec -u 0 el8 dnf -y install epel-release
          docker exec -u 0 el8 dnf -y install https://rpms.remirepo.net/enterprise/remi-release-8.rpm
          docker exec -u 0 el8 dnf -y module enable php:remi-8.5
          docker exec -u 0 el8 dnf -y install composer git unzip php-cli php-pdo php-sqlite3 \
            php-mysqlnd php-mbstring php-intl php-gd php-bcmath php-xml php-pecl-zip php-process \
            php-sodium php-opcache
      - run: docker exec el8 composer install --no-interaction --no-progress --prefer-dist
      # Raising LIBRARY_MINIMUM turns this red until the image and the job name move with it.
      - name: Check the SQLite under test
        run: |
          docker exec -i el8 php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $floor = App\SiteCheck\SqliteSupport::LIBRARY_MINIMUM;
          $pdo = new PDO('sqlite::memory:');
          $pdoVersion = $pdo->getAttribute(PDO::ATTR_SERVER_VERSION);
          $extVersion = extension_loaded('sqlite3') ? SQLite3::version()['versionString'] : 'missing';
          echo 'PHP ', PHP_VERSION, ", pdo_sqlite on SQLite $pdoVersion, sqlite3 extension on SQLite $extVersion\n";
          if ($pdoVersion !== $floor || $extVersion !== $floor) {
              echo "::error::this lane is meant to run on SQLite $floor\n";
              exit(1);
          }
          try {
              $pdo->prepare('SELECT '.implode(',', array_fill(0, 1000, '?')));
              echo "::error::SQLite $pdoVersion took 1000 bound parameters; this lane is meant to refuse them\n";
              exit(1);
          } catch (PDOException $e) {
              echo '1000 bound parameters refused: ', $e->getMessage(), "\n";
          }
          PHP
      - name: Prepare environment
        run: |
          docker exec el8 cp .env.example .env
          docker exec el8 php artisan key:generate
          docker exec el8 touch database/database.sqlite
      - run: docker exec el8 php artisan migrate --force
      - run: docker exec el8 php artisan test --parallel

  # The image suite again, against a live imgproxy sidecar, so the second ImageProcessor is held to
  # the same contract as GD (docs/internals/images.md, "Processing"). The sidecar reads the checkout
  # through a bind mount, which is how it sees the files the app spools for it. Not a required check
  # until it has proven itself steady.
  test-imgproxy:
    name: Test (PHP 8.5, imgproxy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      imgproxy:
        image: ghcr.io/imgproxy/imgproxy:v4.0.14
        env:
          IMGPROXY_KEY: 943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881
          IMGPROXY_SALT: 520f986b998545b4785e0defbc4f3c1203f22de2374a3d53cb7a7fe9fea309c5
          IMGPROXY_LOCAL_FILESYSTEM_ROOT: /workspace
          IMGPROXY_ALLOWED_SOURCES: local://
          IMGPROXY_ALLOW_SECURITY_OPTIONS: 'true'
          # Stated rather than inherited, so the budgets the docs quote are the ones tested.
          IMGPROXY_MAX_SRC_RESOLUTION: '50'
          IMGPROXY_MAX_ANIMATION_FRAME_RESOLUTION: '0'
        ports:
          - 8080:8080
        volumes:
          - ${{ github.workspace }}:/workspace:ro
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      OPENPNE_IMAGE_PROCESSOR: imgproxy
      OPENPNE_IMGPROXY_URL: http://127.0.0.1:8080
      OPENPNE_IMGPROXY_KEY: 943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881
      OPENPNE_IMGPROXY_SALT: 520f986b998545b4785e0defbc4f3c1203f22de2374a3d53cb7a7fe9fea309c5
      OPENPNE_IMGPROXY_SOURCE_PREFIX: storage/app/image-spool/
      PAO_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          curl -fsS http://127.0.0.1:8080/health
      - run: php artisan migrate --force
      # The contract test skips itself without OPENPNE_IMAGE_PROCESSOR=imgproxy; here a skip would mean
      # the lane tested GD twice and proved nothing, so it fails.
      - run: php artisan test tests/Feature/File/ImgproxyImageProcessorContractTest.php --fail-on-skipped
      # One path per run: the test command takes a single path argument.
      - run: |
          set -e
          for suite in tests/Unit/Files tests/Feature/File tests/Feature/LinkCard tests/Feature/Http/AppIconTest.php tests/Feature/Mcp/DiaryImageReadToolTest.php tests/Feature/Mcp/DiaryImagePostToolTest.php tests/Feature/Mcp/TalkImageToolTest.php; do
            php artisan test --parallel "$suite"
          done

  # The mysql suite is the CI long-pole, so its work fans out across a matrix of internal shard jobs
  # and a fixed-name aggregator reports the single required status. paratest's --functional splits
  # work at the method level, making --shard=i/N a disjoint, complete partition; round-robin spreads
  # the heavy Upgrade methods evenly across shards. The shard matrix is deliberately NOT a required
  # check (see the per-combination trap above) — the aggregator below carries the required name.
  mysql-shard:
    name: mysql shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Pinned by digest, which Dependabot does not read here: bump the tag and digest together from
      # `docker buildx imagetools inspect mysql:8.4` (the trailing comment is the version it resolves to),
      # here, in release-compat.yml and in release.yml's archive job. release.yml's oldest-mysql job
      # and mariadb-shard below repeat this job's steps: a change to them goes there too.
      MYSQL_IMAGE: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 # 8.4.11
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: openpne_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      # laravel/pao rewrites test output when it detects an agent env; pin it off for deterministic CI.
      PAO_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # Not a `services:` container: a Docker Hub timeout there fails the shard with no retry. tmpfs
      # datadir: fsync/doublewrite become memory writes, cutting DDL-heavy per-process migrate time.
      - name: Pull the MySQL image
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$MYSQL_IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "pull attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::could not pull $MYSQL_IMAGE after 5 attempts"
          exit 1
      - name: Start MySQL
        run: >-
          docker run -d --name mysql -p 3306:3306 --tmpfs /var/lib/mysql:rw
          -e MYSQL_ROOT_PASSWORD=secret -e MYSQL_DATABASE=openpne_test
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
          "$MYSQL_IMAGE"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Wait for MySQL
        run: |
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mysql)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' mysql)" != true ]; then
              echo "::error::MySQL exited during startup"
              docker logs mysql
              exit 1
            fi
            sleep 5
          done
          echo "::error::MySQL did not become healthy within 200s (last status: $status)"
          docker logs mysql
          exit 1
      - run: php artisan migrate --force
      # --functional shards at the method level so --shard=i/N is a disjoint, complete split;
      # --fail-on-empty-test-suite turns a mis-targeted shard (0 tests) into a failure, not a pass.
      - run: >-
          php artisan test --parallel --functional
          --shard-test-distribution=round-robin
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --fail-on-empty-test-suite

  # Fixed-name required check: the ruleset requires "Test (PHP 8.5, mysql)". Runs on every PR
  # (if: always()) and reports the shard matrix's aggregate result; on a docs-only PR the shards are
  # skipped and this still reports success. Fail-closed on any unexpected changes/shard state.
  test-mysql:
    name: Test (PHP 8.5, mysql)
    needs: [changes, mysql-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate mysql shard results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.mysql-shard.result }}
        run: |
          set -euo pipefail
          case "$CODE" in true | false) ;; *) echo "::error::invalid changes.code output '$CODE'"; exit 1 ;; esac
          [ "$CHANGES" = success ] || { echo "::error::changes detector did not succeed ($CHANGES)"; exit 1; }
          if [ "$CODE" != true ]; then echo "docs-only change; mysql shards skipped; reporting success"; exit 0; fi
          [ "$SHARDS" = success ] || { echo "::error::mysql shard(s) did not succeed ($SHARDS)"; exit 1; }
          echo "all mysql shards passed"

  # mysql-shard's steps on MariaDB 10.11, the oldest docs/installing.md supports.
  mariadb-shard:
    name: mariadb shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Pinned by digest as MYSQL_IMAGE is, from `docker buildx imagetools inspect mariadb:10.11`, here
      # and in release-compat.yml.
      MARIADB_IMAGE: mariadb:10.11@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7 # 10.11.19
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: openpne_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      PAO_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Pull the MariaDB image
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$MARIADB_IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "pull attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::could not pull $MARIADB_IMAGE after 5 attempts"
          exit 1
      - name: Start MariaDB
        run: >-
          docker run -d --name mariadb -p 3306:3306 --tmpfs /var/lib/mysql:rw
          -e MARIADB_ROOT_PASSWORD=secret -e MARIADB_DATABASE=openpne_test
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
          "$MARIADB_IMAGE"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Wait for MariaDB
        run: |
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mariadb)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' mariadb)" != true ]; then
              echo "::error::MariaDB exited during startup"
              docker logs mariadb
              exit 1
            fi
            sleep 5
          done
          echo "::error::MariaDB did not become healthy within 200s (last status: $status)"
          docker logs mariadb
          exit 1
      # Raising DatabaseServer::MARIADB_MINIMUM turns this red until the image moves with it.
      - name: Check the MariaDB under test
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          use App\Database\DatabaseServer;
          $pdo = new PDO('mysql:host='.getenv('DB_HOST').';port='.getenv('DB_PORT'), getenv('DB_USERNAME'), getenv('DB_PASSWORD'));
          $version = $pdo->query('SELECT VERSION()')->fetchColumn();
          $server = DatabaseServer::fromVersion($version);
          echo 'PHP ', PHP_VERSION, ", {$server->name()} ({$version})\n";
          if (! $server->mariaDb || ! str_starts_with($server->version.'.', DatabaseServer::MARIADB_MINIMUM.'.')) {
              echo '::error::this lane is meant to run on MariaDB ', DatabaseServer::MARIADB_MINIMUM, "\n";
              exit(1);
          }
          PHP
      - run: php artisan migrate --force
      - run: >-
          php artisan test --parallel --functional
          --shard-test-distribution=round-robin
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --fail-on-empty-test-suite

  # test-mysql's counterpart for the mariadb shards.
  test-mariadb:
    name: Test (PHP 8.5, mariadb)
    needs: [changes, mariadb-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate mariadb shard results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.mariadb-shard.result }}
        run: |
          set -euo pipefail
          case "$CODE" in true | false) ;; *) echo "::error::invalid changes.code output '$CODE'"; exit 1 ;; esac
          [ "$CHANGES" = success ] || { echo "::error::changes detector did not succeed ($CHANGES)"; exit 1; }
          if [ "$CODE" != true ]; then echo "docs-only change; mariadb shards skipped; reporting success"; exit 0; fi
          [ "$SHARDS" = success ] || { echo "::error::mariadb shard(s) did not succeed ($SHARDS)"; exit 1; }
          echo "all mariadb shards passed"

  # Not a required check, and must not become one: its matrix job is skipped by a job-level `if`,
  # which never creates the per-combination check names (the note above test-sqlite).
  release-compat:
    name: Release compatibility
    needs: changes
    # A release runs it itself, against the last tag: the lookup here would name the release's own branch.
    if: needs.changes.outputs.code == 'true' && inputs.ref == ''
    uses: ./.github/workflows/release-compat.yml
    with:
      onto: ${{ github.base_ref }}

  # .github/scripts/release-archive.sh on PHP 8.3, the oldest a site may run; the update is walked
  # from the archive to itself, there being no earlier one to start from. Not a required check.
  release-archive:
    name: Release archive (build + install)
    needs: changes
    if: needs.changes.outputs.code == 'true' && inputs.ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - run: .github/scripts/release-archive.sh build HEAD "$RUNNER_TEMP/archive" 0.0.0-ci
      - run: .github/scripts/release-archive.sh verify "$RUNNER_TEMP/archive" 0.0.0-ci HEAD
      - run: .github/scripts/release-archive.sh update "$RUNNER_TEMP/archive" 0.0.0-ci "$RUNNER_TEMP/archive" 0.0.0-ci

  lint:
    name: Lint (Pint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/pint --test

  frontend:
    # This name is a required status check context in branch protection — keep it stable when
    # adding steps, or the ruleset waits forever on the old context and blocks merges.
    name: Frontend (type-check + build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
