# Static analysis of the TypeScript and JavaScript under resources/js; CodeQL has no PHP analyzer, so
# the PHP side keeps its own test and lint gates. Deliberately NOT a required check, so a plain paths
# filter is safe (see the required-checks note in ci.yml); the weekly run keeps the main branch's
# analysis current for pull requests to compare against.
name: CodeQL

on:
  pull_request:
    paths:
      - 'resources/js/**'
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/codeql.yml
  push:
    branches: [main]
    paths:
      - 'resources/js/**'
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/codeql.yml
  schedule:
    - cron: '45 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:javascript-typescript'
