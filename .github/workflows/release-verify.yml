# The checks in release.yml run when a release is drafted; the tag is created later, when someone
# publishes the draft. This says whether what was published is what was checked. It runs after the
# fact: a failure here means the release and its tag have to be deleted and drafted again.
name: Release published

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: The published release is the one that was checked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
      - env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: .github/scripts/release-validate.sh published "$TAG"
