# Dependency vulnerability audit. composer audit and npm audit query advisory
# databases, so the result is time-dependent: a newly published advisory can
# turn this red on a PR that never touched dependencies. For that reason this
# workflow is intentionally NOT in the branch-protection required-checks set —
# it gives per-PR feedback and repeats weekly so an advisory published between
# PRs still surfaces. Defense in depth: roave/security-advisories (require-dev)
# already fails `composer install` on a vulnerable locked dependency in the CI
# lanes; this adds a readable report on top. composer audit runs --locked, so
# it audits the committed lock without installing.
name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: '20 3 * * 1' # weekly, Monday 03:20 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Audit Composer dependencies (committed lock)
        run: composer audit --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
