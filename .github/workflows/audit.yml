# Dependency vulnerability audit, two tiers. composer audit and npm audit query
# advisory databases, so the result is time-dependent: a newly published advisory
# can turn a check red on a PR that never touched dependencies. Policy:
#
#   - PR gate (job "Dependency audit"): fails only on advisories the PR
#     introduces relative to its base branch (.github/scripts/audit-delta.sh).
#     Advisories already present on the base are reported, not blocking: they
#     are the base branch's problem, owned by the scheduled audit below, so an
#     unrelated PR never has to carry the fix.
#   - Scheduled full audit (every 4 hours): all severities plus abandoned
#     packages. A failure files or updates a `dependency-audit` issue instead of
#     painting commits red — and a clean run closes it — so the fix flows
#     through a separate lock-only bump PR. Dependabot security updates are
#     enabled but cover only advisories listed in the GitHub Advisory Database
#     with a fix inside the declared ranges; Packagist-first advisories and
#     pinned transitive dependencies do not produce a Dependabot PR.
#
# roave/security-advisories (require-dev) keeps `composer update` from resolving
# to a vulnerable version; it does not re-check a committed lock on install, so
# this workflow is the only lane that sees a new advisory on an unchanged lock.
name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: '20 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Dependency audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the base branch lockfiles
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          mkdir base
          for f in composer.json composer.lock package.json package-lock.json; do
            git show "origin/$BASE_REF:$f" > "base/$f"
          done

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Audit advisories introduced relative to the base branch
        run: .github/scripts/audit-delta.sh base .

  full-report:
    name: Full audit (all severities)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize schedule/dispatch runs: the create-or-comment step is a
    # list-then-write race that could otherwise file duplicate issues.
    concurrency:
      group: dependency-audit-full-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Full Composer audit (committed lock)
        id: composer
        continue-on-error: true
        # Explicit `shell: bash` enables pipefail; the default `bash -e` lets
        # tee mask a non-zero audit exit, so findings never reach the issue step.
        shell: bash
        run: composer audit --locked 2>&1 | tee composer-audit.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Full npm audit
        id: npm
        continue-on-error: true
        shell: bash
        run: npm audit 2>&1 | tee npm-audit.txt

      - name: File or update the dependency-audit issue
        if: steps.composer.outcome == 'failure' || steps.npm.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        # The fingerprint keeps a 4-hourly run from re-posting the same findings;
        # the issue only gets a comment when the set of findings changes.
        run: |
          fingerprint="$(cat composer-audit.txt npm-audit.txt | sha256sum | cut -c1-16)"
          {
            echo "<!-- audit-fingerprint:$fingerprint -->"
            echo "Scheduled full-severity audit found advisories ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo
            echo "These do not block PRs — fix with a lock-only bump PR."
            echo
            if [ "${{ steps.composer.outcome }}" = "failure" ]; then
              echo '## composer audit'
              echo '```'
              tail -n 200 composer-audit.txt
              echo '```'
            fi
            if [ "${{ steps.npm.outcome }}" = "failure" ]; then
              echo '## npm audit'
              echo '```'
              tail -n 200 npm-audit.txt
              echo '```'
            fi
          } > issue-body.md
          gh label create dependency-audit --description "Open advisories from the scheduled dependency audit" --color D93F0B --force
          existing="$(gh issue list --label dependency-audit --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "Dependency audit: open advisories on main" --label dependency-audit --body-file issue-body.md
          elif gh issue view "$existing" --json body,comments --jq '[.body, .comments[].body] | last' | grep -q "audit-fingerprint:$fingerprint"; then
            echo "Issue #$existing already reports these findings."
          else
            gh issue comment "$existing" --body-file issue-body.md
          fi

      - name: Close the dependency-audit issue when clean
        if: steps.composer.outcome == 'success' && steps.npm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in $(gh issue list --label dependency-audit --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Scheduled audit is clean again ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
          done

      - name: Reflect the audit result
        if: steps.composer.outcome == 'failure' || steps.npm.outcome == 'failure'
        run: |
          echo "Advisories found — see the dependency-audit issue."
          exit 1
