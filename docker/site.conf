server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Sized for the shipped OPENPNE_IMAGE_MAX_UPLOAD_KB default like php-upload.ini; raise both
    # with the cap, or nginx rejects an upload PHP would accept (its default of 1m rejects image
    # posts before PHP sees them).
    client_max_body_size 24m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;
    }
}
